name: Classnote data safety

on:
  pull_request:
    paths:
      - 'index.html'
      - 'classnote-data.js'
      - 'tests/data-safety.test.cjs'
      - '.github/workflows/data-safety.yml'
  push:
    paths:
      - 'index.html'
      - 'classnote-data.js'
      - 'tests/data-safety.test.cjs'
      - '.github/workflows/data-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  data-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Backup integrity and merge regression tests
        run: node tests/data-safety.test.cjs
